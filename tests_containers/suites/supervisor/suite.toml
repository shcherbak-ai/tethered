description = "supervisord (Debian's, not Python-aware of tethered) between an activated entry point and a Python program"

# tests_containers/images/<image>.Dockerfile
image = "base"
# Extra Debian packages for the image, and whether it needs a C compiler.
# supervisor is the distribution's package: it runs on Debian's own python3,
# which has no tethered.
apt = ["supervisor"]
compiler = false
# The packages whose versions the runner prints in its summary.
key_packages = ["tethered"]

# Python versions the suite does not run on, each with the reason:
#   "3.15" = "no wheel yet for ..."
[unsupported_python]
