; supervisord in the foreground with one program.  APP_COMMAND, in the
; environment of supervisord, is the command of the program; its output goes
; to supervisord's own stdout, which the harness captures.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/tc-supervisord-%(ENV_PORT)s.pid

[program:app]
command=%(ENV_APP_COMMAND)s
directory=%(here)s
; A configured environment: supervisord adds this to its own and passes both on.
environment=CONFIGURED="yes"
autorestart=true
startsecs=0
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
