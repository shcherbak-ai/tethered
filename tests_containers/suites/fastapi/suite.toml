description = "FastAPI from fastapi[standard]: fastapi run and uvicorn main:app, the cookbook's handler with httpx, activation in a lifespan handler"

# tests_containers/images/<image>.Dockerfile
image = "base"
# Extra Debian packages for the image, and whether it needs a C compiler.
apt = []
compiler = false
# The packages whose versions the runner prints in its summary.
key_packages = ["fastapi", "fastapi-cli", "uvicorn", "uvloop", "httpx", "anyio", "starlette"]

# Python versions the suite does not run on, each with the reason:
#   "3.15" = "no wheel yet for ..."
[unsupported_python]
