description = "uvicorn 0.46.0, the last release that loads uvloop before the application: the command, uvicorn.run(), gunicorn's UvicornWorker, fastapi run"

# tests_containers/images/<image>.Dockerfile
image = "base"
# Extra Debian packages for the image, and whether it needs a C compiler.
apt = []
compiler = false
# The packages whose versions the runner prints in its summary.
key_packages = ["uvicorn", "uvloop", "gunicorn", "uvicorn-worker", "fastapi-cli"]

# Python versions the suite does not run on, each with the reason:
#   "3.15" = "no wheel yet for ..."
[unsupported_python]
