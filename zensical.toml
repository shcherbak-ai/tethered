# The documentation site: https://tethered.shcherbak.ai/
#
#   uv run inv docs-live   # preview at http://localhost:9000
#   uv run inv docs        # what CI runs; the site is written to site/
#
# Both tasks (tasks.py) run Zensical at the versions pinned in
# .github/docs-constraints.txt.
#
# The site sets no cookie and asks no third party for anything: fonts are the
# reader's own, there is no analytics, and nothing below turns on a feature
# that loads a script or a stylesheet from another host. Keep it so: do not set
# repo_url (the theme would ask api.github.com for star counts), and do not
# enable a Mermaid or MathJax fence (each is fetched from a CDN).

[project]
site_name = "tethered"
site_url = "https://tethered.shcherbak.ai/"
site_description = "Runtime network egress control for Python. One function call, zero dependencies, no infrastructure changes."
site_author = "Sergii Shcherbak"
# The version is rewritten by `cz bump` (version_files in pyproject.toml).
copyright = "tethered 1.0.0 &middot; Copyright &copy; 2026 Sergii Shcherbak. MIT License."
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

# A page that is not listed here is built all the same, but nothing leads to it.
nav = [
  { "Home" = "index.md" },
  { "Quick start" = "quickstart.md" },
  { "Guides" = [
    { "Cookbook" = "COOKBOOK.md" },
    { "Subprocess control" = "SUBPROCESS.md" },
    { "Migrating to 1.0" = "migrating-to-v1.md" },
  ] },
  { "Reference" = [
    { "API reference" = "API.md" },
    { "Compatibility" = "COMPATIBILITY.md" },
    { "Architecture" = "ARCHITECTURE.md" },
  ] },
  { "Security" = "security.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
font = false
logo = "assets/tethered-mark.svg"
favicon = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/shcherbak-ai/tethered"
name = "tethered on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/tethered/"
name = "tethered on PyPI"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
# A heading's anchor is the one GitHub gives it, so a link between two pages
# works in the repository and on the site ("a — b" is "a--b" in both).
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.details = {}
# An anchor at the start of every line of a code block. The stylesheet tells a
# block of one line from the others by them (docs/stylesheets/extra.css).
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.quotes.callouts = true
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}

# llms.txt, the index of the documentation for language models and coding
# agents (https://llmstxt.org/): the build writes it to the root of the site,
# with a Markdown copy of every page it lists beside the HTML one. They are
# static files like the rest; nothing is fetched from anywhere. A page that is
# added to nav above goes into a section below as well, in the same order and
# with the description of its front matter: tests/test_llms_index.py fails
# until it does. The home page is left out, since the index says what it says.
# There is no llms-full.txt: the index lets a reader take the page it needs.
[project.plugins.llmstxt]
markdown_description = "tethered checks every connection made through Python's socket layer against an allow list, from inside the process, before the connection is opened. `activate()` sets the ceiling for the whole process, and `scope()` narrows a single code path. It is a guardrail at Python's audit-event layer, not a sandbox: code that goes below that layer (`ctypes`, a C extension, a library that resolves and connects inside its own C code) is not stopped."

[project.plugins.llmstxt.sections]
"Get started" = [
  { "quickstart.md" = "Install tethered, set an allow list for the process, narrow a code path, and lock the policy in production." },
]
"Guides" = [
  { "COOKBOOK.md" = "What each server, task queue and pool needs for a tethered policy to hold in every worker, how to handle a blocked connection in Django, FastAPI and Celery, and patterns for package authors." },
  { "SUBPROCESS.md" = "How a tethered policy and a scope reach Python child processes, and what external_subprocess_policy does with every other launch." },
  { "migrating-to-v1.md" = "Upgrading tethered from 0.5.x to 1.0.0: the breaking changes by what a deployment uses, the message each one shows, and the change that puts it right." },
]
"Reference" = [
  { "API.md" = "The tethered API: activate(), scope() and deactivate() with every parameter, the exceptions, the allow list syntax, locked mode and log-only mode." },
  { "COMPATIBILITY.md" = "What tethered enforces, what needs configuration, what it refuses at start-up and what it does not see, measured under real servers, task queues and client libraries." },
  { "ARCHITECTURE.md" = "How tethered works: the audit hook and the events it handles, scopes, child processes, the C guardian behind locked mode, and the measured overhead." },
]
"Security" = [
  { "security.md" = "The tethered security model: the threat model, what tethered protects against and what it does not, and what locked mode does and does not do." },
]
# A section of this name may be left out by a reader that is short of room.
"Optional" = [
  { "changelog.md" = "What changed in each tethered release." },
]
