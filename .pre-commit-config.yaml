# A hook without `stages` runs at every installed stage. At commit-msg it is
# given the message file, so a hook without a file filter (uv lock --check)
# would run a second time for each commit.
default_stages: [pre-commit]

# Every hook runs a tool of uv.lock or of package-lock.json, or a script of the
# repository, and none a repository that pre-commit installs: it would resolve
# the dependencies of that repository afresh, past the cooldown of the
# lockfiles and their advisory check.
repos:
  # The hooks of pre-commit-hooks, from its package in uv.lock, defined as in
  # its repository.
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: uv run check-toml
        language: system
        types: [toml]

  # The Python tools run from the project environment (`uv run`), so the
  # hooks, the commands in AGENTS.md / CONTRIBUTING.md and CI all use the one
  # version of each that uv.lock pins.  A hook pinned here as well would
  # drift from it: upgrade a tool with `uv lock --upgrade-package <name>`.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # markdownlint-cli2 from package-lock.json (`npm ci` installs it), with the
  # Node that npm uses for the development tools.
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: node node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs
        language: system
        types: [markdown]

  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: true
      # No value of .env in a tracked file: in the staged files at a commit, and
      # in all the tracked files with --all-files. Without a .env file, as in
      # CI, it fails on a tracked env file only. pre-commit passes only the
      # files that have every tag of `types`, by default `file`, which a
      # symbolic link lacks.
      - id: omerta
        name: omerta (no value of .env in the tracked files)
        entry: uv run omerta check
        language: system
        types: []
        types_or: [file, symlink]
      - id: ty
        name: ty
        entry: uv run ty check src/ examples/
        language: system
        types: [python]
        pass_filenames: false
      - id: interrogate
        name: interrogate
        entry: uv run interrogate src/
        language: system
        types: [python]
        pass_filenames: false
      # Imports against declared dependencies, so a change to either runs it.
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        types_or: [python, toml]
        pass_filenames: false
      # The GitHub workflows, for what an attacker could reach through them: a
      # checkout that leaves its token in the workspace, a value of the event
      # expanded in a script, a trigger that runs on untrusted code.  Offline:
      # the audits that ask GitHub's API are left out.
      - id: zizmor
        name: zizmor
        entry: uv run zizmor --offline --no-progress .github/workflows
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
      # A release enters the lockfiles a week after its upload, and no version
      # that tethered installs has an advisory at osv.dev, but for its
      # ACCEPTED_ADVISORIES.  At each commit, as an advisory comes out without
      # a change to a file.  CI skips it (SKIP), where its result would depend
      # on the day, not on the commit.  Verbose, for its warnings, which do not
      # fail it.
      - id: advisories
        name: cooldown and advisories
        entry: uv run python scripts/check_advisories.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck (docker)
        entry: bash scripts/cppcheck.sh
        language: system
        types: [c]

  # The tests of the Claude Code hook that keeps the agents' browser files in
  # one folder, and of the settings that start it, with Node's own runner: the
  # Node that npm needs for the development tools (package.json).
  - repo: local
    hooks:
      - id: claude-hooks
        name: claude hooks tests
        entry: node --test .claude/hooks/playwright-files.test.mjs
        language: system
        files: ^\.claude/(hooks/|settings\.json$)
        pass_filenames: false

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
