repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  # The Python tools run from the project environment (`uv run`), so the
  # hooks, the commands in AGENTS.md / CONTRIBUTING.md and CI all use the one
  # version of each that uv.lock pins.  A hook pinned here as well would
  # drift from it: upgrade a tool with `uv lock --upgrade-package <name>`.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: true
      - id: ty
        name: ty
        entry: uv run ty check src/ examples/
        language: system
        types: [python]
        pass_filenames: false
      - id: interrogate
        name: interrogate
        entry: uv run interrogate src/
        language: system
        types: [python]
        pass_filenames: false
      # Imports against declared dependencies, so a change to either runs it.
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        types_or: [python, toml]
        pass_filenames: false
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck (docker)
        entry: bash scripts/cppcheck.sh
        language: system
        types: [c]

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
