name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The uv every job installs.  Without it a new uv release would change what
# CI runs without a commit.
env:
  UV_VERSION: "0.13.0"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job's permissions replace the workflow's, so contents is named again.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        language: [python, c-cpp]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Install uv (C build)
        if: matrix.language == 'c-cpp'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      # uv python install without a version: the one .python-version names.
      - name: Build C extension (for CodeQL tracing)
        if: matrix.language == 'c-cpp'
        run: |
          uv python install
          uv venv
          uv pip install setuptools
          uv run python setup.py build_ext --inplace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
