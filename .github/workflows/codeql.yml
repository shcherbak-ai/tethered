name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The uv every job installs.  Without it a new uv release would change what
# CI runs without a commit.
env:
  UV_VERSION: "0.13.5"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job's permissions replace the workflow's, so contents is named again.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        language: [python, c-cpp]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Install uv (C build)
        if: matrix.language == 'c-cpp'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      # uv python install without a version: the one .python-version names.
      # --locked: fail when uv.lock does not match pyproject.toml, so the
      # build runs on the setuptools the lock names.
      - name: Build C extension (for CodeQL tracing)
        if: matrix.language == 'c-cpp'
        run: |
          uv python install
          uv sync --locked
          uv run python setup.py build_ext --inplace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
