name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Note: the publish workflow (.github/workflows/publish.yml) triggers
# via workflow_run after CI succeeds. A tag push and main push may both
# trigger CI; the publish workflow uses a concurrency group to cancel
# the duplicate.

permissions:
  contents: read

# The uv every job installs.  Without it a new uv release would change what
# CI runs without a commit.
env:
  UV_VERSION: "0.13.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      # Without a version this installs the one .python-version names, the
      # development interpreter, which is what uv sync and uv run then use.
      - name: Set up Python
        run: uv python install

      # --locked: fail when uv.lock does not match pyproject.toml, where a
      # plain sync would resolve again and run other versions of the tools.
      - name: Install dependencies
        run: uv sync --locked

      # The development tools of package-lock.json, for the markdownlint-cli2
      # hook, with the Node of the runner (no install scripts: .npmrc).
      - name: Install the development tools of package.json
        run: npm ci --no-audit --no-fund

      # scripts/cppcheck.sh compiles cppcheck into a Docker image.  The image
      # is kept in the cache under the hash of that script, so it is built
      # once per cppcheck version and not once per run.  It is saved before
      # the checks run: a run that fails a check still leaves it behind.
      - name: Restore the cppcheck image
        id: cppcheck-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/cppcheck-image.tar
          key: cppcheck-image-${{ hashFiles('scripts/cppcheck.sh') }}

      - name: Load the cppcheck image
        if: steps.cppcheck-image.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/cppcheck-image.tar"

      - name: Build the cppcheck image
        if: steps.cppcheck-image.outputs.cache-hit != 'true'
        run: |
          bash scripts/cppcheck.sh --version
          docker save --output "$RUNNER_TEMP/cppcheck-image.tar" \
            "$(docker image ls --format '{{.Repository}}:{{.Tag}}' tethered-cppcheck)"

      - name: Save the cppcheck image
        if: steps.cppcheck-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/cppcheck-image.tar
          key: ${{ steps.cppcheck-image.outputs.cache-primary-key }}

      # Every checker runs from here in the version the repository pins: the
      # Python tools from uv.lock, the hook repositories by commit, and
      # cppcheck from the image scripts/cppcheck.sh builds.  The advisories
      # hook is skipped: it asks osv.dev, so its result depends on the day
      # and not on the commit.
      - name: Run pre-commit checks (includes ty and cppcheck)
        run: uv run pre-commit run --all-files
        env:
          SKIP: advisories

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # .python-version names the development interpreter, and a plain uv run
    # rebuilds the environment on it whatever uv sync was told.  UV_PYTHON
    # outranks the file, so every uv command of a cell stays on its Python.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # uv run syncs the environment first, which would install what a cell
      # left out (below) after all.
      UV_NO_SYNC: ${{ matrix.leave-out && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64, macOS on Apple Silicon and on Intel, Windows x64 and on
        # ARM.  Of the platforms the wheels are built for, Linux on ARM, musl
        # and 32-bit Windows get the smoke test of publish.yml only.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # hyperscan (which the omerta hook needs) and zizmor have no wheel for
        # Windows on ARM; the tests use neither, so a cell there leaves them out.
        include:
          - os: windows-11-arm
            leave-out: --no-install-package hyperscan --no-install-package zizmor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Name the interpreter: without a request uv passes over a pre-release
      # build in favour of any stable Python already on the runner.
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} ${{ matrix.leave-out }}

      # A cell that ran on another Python would pass all the same, and the
      # matrix would test one version five times: fail it here instead.
      - name: Check that uv run is on Python ${{ matrix.python-version }}
        run: uv run python -c "import sys; print(sys.version); assert sys.version.startswith('${{ matrix.python-version }}.')"

      # The same for the architecture: Windows on ARM runs x64 programs too,
      # and a cell there on an x64 Python would test the x64 build.
      - name: Check that uv run is on the runner's architecture
        run: |
          uv run python -c "import os, platform; m = platform.machine().lower(); print(m); assert m in {'X64': ('x86_64', 'amd64'), 'ARM64': ('arm64', 'aarch64')}[os.environ['RUNNER_ARCH']]"

      # -n auto: pytest-xdist runs the tests in one worker process per CPU of
      # the runner, and pytest-cov adds up what the workers measured.
      - name: Run tests with coverage
        run: uv run pytest tests/ -v -n auto --cov=src/tethered --cov-report=xml --cov-report=term-missing --cov-fail-under=100

      - name: Extract coverage percentage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        id: coverage
        run: |
          RATE=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('coverage.xml').getroot().get('line-rate'))")
          PCT=$(python3 -c "print(round(float('$RATE') * 100))")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: tethered-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.pct }}%
          valColorRange: ${{ steps.coverage.outputs.pct }}
          minColorRange: 50
          maxColorRange: 100
