name: Publish

# Runs after every CI run, one of a pull request from a fork included, with
# the workflow and the context of the default branch (main).  Nothing is
# checked out from the run or published unless the gate finds a v* tag of
# this repository on its commit and that commit on main, and the pypi
# environment accepts deployments from main only: that is why zizmor's
# dangerous-triggers finding is ignored on the trigger.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

# The uv every job installs.  Without it a new uv release would change what
# CI runs without a commit.  The SHA-256 of its Linux archive
# (uv-x86_64-unknown-linux-gnu.tar.gz.sha256 on the release page) changes
# with it: setup-uv holds the checksums of the uv releases before its own
# only, and checks a newer one against a list it fetches from uv's publisher
# at run time, which is not enough for the job that builds the sdist.
env:
  UV_VERSION: "0.13.5"
  UV_SHA256: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"

jobs:
  publish-gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify v* tag on main
        id: check
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Check for an actual v* tag pointing at this commit
          TAG=$(git tag --points-at "$SHA" | grep '^v' | head -n1)
          if [ -z "$TAG" ]; then
            echo "::notice::No v* tag at $SHA — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Verify the tagged commit is on main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::notice::Tag $TAG is not on main — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing $TAG ($SHA)"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-wheels:
    needs: [publish-gate]
    if: needs.publish-gate.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      # From v7, checkout refuses the commit of a fork's pull request under
      # workflow_run.  The gate passes only a tagged commit on main, which a
      # push brought, so no allow-unsafe-pr-checkout is needed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build wheels
        uses: pypa/cibuildwheel@8c2dcd2e96041a619f5ff03c9638d7941e2553a4  # v4.3.3
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-* cp315-*
          CIBW_SKIP: "*-musllinux_i686"
          CIBW_ARCHS_LINUX: "auto"
          # The build requirements (setuptools) as of a week ago, as
          # [tool.uv] exclude-newer holds uv.lock: a release that is younger
          # does not go into the published wheels.  cibuildwheel builds with
          # pip, which does not read pyproject.toml's [tool.uv]; pip 26.1+
          # takes a span, and cibuildwheel and its manylinux and musllinux
          # images carry 26.2.2.
          CIBW_ENVIRONMENT: PIP_UPLOADED_PRIOR_TO=P7D
          # Verifies the C extension imports, tethered.pth landed in
          # site-packages, and the auto-activation chain enforces
          # against a deny-all policy in a spawned child.
          CIBW_TEST_COMMAND: "python {project}/scripts/wheel_smoke_test.py"

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    needs: [publish-gate]
    if: needs.publish-gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256 }}

      # The version .python-version names.
      - name: Set up Python
        run: uv python install

      # The notes of the GitHub release: the version's section of the
      # changelog.  Taken here, before anything is published, so that a
      # version without one stops the release before it reaches PyPI; and
      # written outside the checkout, so that the sdist holds the tagged
      # commit only.
      - name: Write the release notes
        env:
          TAG: ${{ needs.publish-gate.outputs.tag }}
        run: uv run --no-project python scripts/release_notes.py "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"

      # [tool.uv] exclude-newer (pyproject.toml) holds the build requirements
      # to the releases of a week ago here too.
      - name: Build sdist
        run: uv build --sdist

      # Uploaded before the check below installs anything, so that nothing it
      # runs can change the file that is published.  A failed check still
      # stops the release: the publish job needs this job.
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

      # Mirror the wheel job's smoke test for the sdist path: build a wheel
      # from the published sdist, install it, and run the smoke test against
      # it.  Catches anything missing from the sdist that's needed for a
      # working source install (tethered.pth, _guardian.c, _autoactivate.py,
      # etc.) before the artifact reaches PyPI.
      #
      # Install into a fresh venv (not the runner's system Python).  pip on
      # the runner's system Python falls back to ``--user`` because the
      # system site-packages isn't writable, which lands the ``.pth`` in
      # ``~/.local/...`` — but ``sysconfig.get_path("purelib")`` (used by
      # ``wheel_smoke_test.py``) returns the *system* purelib, so the smoke
      # test would falsely report a missing ``.pth``.  A venv has a writable
      # purelib that ``sysconfig`` reports correctly.
      #
      # uv seeds the venv with the pip of a week ago ([tool.uv]), which keeps
      # the build requirements to that week too (PIP_UPLOADED_PRIOR_TO).
      - name: Verify sdist roundtrip
        env:
          PIP_UPLOADED_PRIOR_TO: P7D
        run: |
          uv venv --seed /tmp/sdist-verify
          /tmp/sdist-verify/bin/python -m pip wheel dist/tethered-*.tar.gz -w wheelhouse-from-sdist/ --no-deps
          /tmp/sdist-verify/bin/python -m pip install wheelhouse-from-sdist/tethered-*.whl
          /tmp/sdist-verify/bin/python scripts/wheel_smoke_test.py

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      # The distributions only: the release notes are an artifact too, and
      # the upload takes every file of dist/ for a distribution.
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # A tag push and a push to main at the same commit give two CI
          # runs, and so two runs of this workflow.  The concurrency group
          # cancels one of them; where that one had uploaded files by then,
          # the other would fail on them without this.
          skip-existing: true

  # The GitHub release of the tag, named after it, with the notes that the
  # sdist job wrote.  This job holds the workflow's only token that can write
  # to the repository, so it runs no code of the project or of its
  # dependencies and checks nothing out: gh is the runner's own, and
  # --verify-tag keeps it from creating a tag.  A release that exists, from a
  # re-run or made by hand, is left as it is.
  release:
    needs: [publish-gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # to create the GitHub release

    steps:
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish-gate.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The release $TAG exists — skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
