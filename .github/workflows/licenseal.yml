name: License compatibility

# The licences of what tethered depends on, against its own (MIT), checked
# with licenseal.  The scan is of the package's own dependencies and not of
# the dev group, which is not distributed with it.  tethered has none, so the
# check passes with nothing to judge; a dependency that is ever declared is
# judged here.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# The uv every job installs.  Without it a new uv release would change what
# CI runs without a commit.
env:
  UV_VERSION: "0.13.0"

jobs:
  licenseal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      # Without a version this installs the one .python-version names.
      - name: Set up Python
        run: uv python install

      # --locked: licenseal runs in the version uv.lock names.
      - name: Install dependencies
        run: uv sync --locked

      # tests_containers/ holds the requirements of the servers and libraries
      # the container suites install into their images.  tethered neither
      # depends on them nor ships them, so they are left out of the scan.
      - name: Check the licences of the dependencies
        run: uv run licenseal check --exclude-dirs tests_containers
